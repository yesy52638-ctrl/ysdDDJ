<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇松的·道德经</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
/* ========== 基础与变量 ========== */
:root{
  --silver-0:#e8e8ec;
  --silver-1:#d4d4da;
  --silver-2:#b8b8c2;
  --silver-3:#8e8e9a;
  --dusty-0:#f0d8de;
  --dusty-1:#e0b8c4;
  --dusty-2:#c99aaa;
  --dusty-3:#b07a8c;
  --ink:#3a3540;
  --ink-soft:#6b6575;
  --glow:rgba(224,184,196,.55);
  --glow-soft:rgba(232,232,236,.7);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Serif SC',serif;
  color:var(--ink);
  background:linear-gradient(160deg,#e8e8ec 0%,#e0d8de 35%,#d8c8d0 60%,#c8b8c4 100%);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.8;
}
/* ========== 光感背景层 ========== */
.aurora{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  overflow:hidden;
}
.blob{
  position:absolute;border-radius:50%;
  filter:blur(80px);opacity:.55;
  animation:drift 20s ease-in-out infinite;
}
.blob.b1{width:50vw;height:50vw;background:radial-gradient(circle,var(--dusty-1),transparent 70%);top:-10%;left:-10%}
.blob.b2{width:40vw;height:40vw;background:radial-gradient(circle,var(--silver-0),transparent 70%);top:30%;right:-10%;animation-delay:-5s}
.blob.b3{width:45vw;height:45vw;background:radial-gradient(circle,var(--dusty-0),transparent 70%);bottom:-15%;left:20%;animation-delay:-10s}
.blob.b4{width:30vw;height:30vw;background:radial-gradient(circle,var(--silver-1),transparent 70%);top:60%;left:30%;animation-delay:-15s}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(4vw,-3vh) scale(1.08)}
  66%{transform:translate(-3vw,4vh) scale(.95)}
}
/* 浮动颗粒 */
.particle{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:#fff;opacity:.6;
  animation:float 12s linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:.7}
  90%{opacity:.4}
  100%{transform:translateY(-10vh) scale(1);opacity:0}
}
/* 鼠标跟随柔光 */
.cursor-glow{
  position:fixed;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,var(--glow) 0%,transparent 70%);
  pointer-events:none;z-index:1;transform:translate(-50%,-50%);
  transition:opacity .3s;opacity:0;
  mix-blend-mode:screen;
}
/* ========== 布局 ========== */
.app{position:relative;z-index:2;display:flex;min-height:100vh}
/* 侧边栏 */
.sidebar{
  width:280px;flex-shrink:0;
  padding:40px 24px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  backdrop-filter:blur(20px);
  background:rgba(255,255,255,.18);
  border-right:1px solid rgba(255,255,255,.3);
}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--dusty-2);border-radius:2px}
.brand{
  text-align:center;margin-bottom:32px;
}
.brand h1{
  font-size:28px;font-weight:900;letter-spacing:.5em;
  color:var(--ink);margin-bottom:6px;
  text-shadow:0 0 30px var(--glow);
}
.brand .sub{
  font-size:12px;color:var(--ink-soft);letter-spacing:.3em;
}
.brand .note{
  font-size:10px;color:var(--silver-3);margin-top:8px;
  font-family:'Noto Sans SC',sans-serif;
}
.nav-section{margin-bottom:20px}
.nav-section-title{
  font-size:13px;font-weight:600;letter-spacing:.2em;
  color:var(--dusty-3);padding:8px 12px;
  border-bottom:1px solid rgba(176,122,140,.2);
  margin-bottom:4px;
}
.nav-list{list-style:none}
.nav-list li{
  padding:6px 12px;font-size:13px;cursor:pointer;
  color:var(--ink-soft);border-radius:6px;
  transition:all .25s;font-family:'Noto Sans SC',sans-serif;
}
.nav-list li:hover{
  background:rgba(224,184,196,.25);color:var(--ink);
  transform:translateX(4px);
}
.nav-list li.active{
  background:rgba(201,154,170,.35);color:var(--ink);
  font-weight:500;
}
/* 主内容 */
.main{
  flex:1;padding:60px 80px;max-width:900px;
}
/* Hero */
.hero{
  text-align:center;padding:80px 0 60px;
  animation:fadeUp 1.2s ease;
}
.hero .title{
  font-size:72px;font-weight:900;letter-spacing:.3em;
  background:linear-gradient(135deg,var(--ink) 0%,var(--dusty-3) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:0 0 60px var(--glow);
  margin-bottom:20px;
}
.hero .subtitle{
  font-size:18px;color:var(--ink-soft);letter-spacing:.4em;
  font-weight:300;
}
.hero .divider{
  width:60px;height:1px;margin:40px auto;
  background:linear-gradient(90deg,transparent,var(--dusty-3),transparent);
}
.hero .desc{
  font-size:14px;color:var(--ink-soft);max-width:500px;
  margin:0 auto;font-weight:300;line-height:2;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
/* 章节卡片 */
.chapter-block{
  margin-bottom:40px;
}
.chapter-header{
  display:flex;align-items:baseline;gap:16px;
  margin-bottom:24px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(176,122,140,.25);
}
.chapter-num{
  font-size:32px;font-weight:900;
  background:linear-gradient(135deg,var(--dusty-3),var(--silver-3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.chapter-section{
  font-size:12px;color:var(--dusty-3);letter-spacing:.2em;
  font-family:'Noto Sans SC',sans-serif;
}
.pair{
  margin-bottom:28px;padding:20px 24px;
  background:rgba(255,255,255,.25);
  border-radius:12px;
  border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(10px);
  transition:all .3s ease;
  position:relative;overflow:hidden;
}
.pair::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  transition:left .6s ease;
}
.pair:hover::before{left:100%}
.pair:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(201,154,170,.25);
  background:rgba(255,255,255,.4);
}
.original{
  font-size:18px;font-weight:600;line-height:2;
  color:var(--ink);margin-bottom:8px;
  letter-spacing:.05em;
}
.annotation{
  font-size:14px;font-weight:300;line-height:2;
  color:var(--ink-soft);
  font-family:'Noto Sans SC',sans-serif;
}
/* 返回顶部 */
.back-top{
  position:fixed;bottom:30px;right:30px;z-index:10;
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,.5);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.6);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--dusty-3);
  opacity:0;pointer-events:none;transition:all .3s;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.back-top.show{opacity:1;pointer-events:auto}
.back-top:hover{
  background:rgba(255,255,255,.8);
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(201,154,170,.3);
}
/* 移动端 */
.menu-toggle{
  display:none;position:fixed;top:20px;left:20px;z-index:20;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.6);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.6);
  cursor:pointer;align-items:center;justify-content:center;
  font-size:20px;color:var(--dusty-3);
}
@media(max-width:900px){
  .sidebar{
    position:fixed;left:-280px;top:0;z-index:15;
    transition:left .3s ease;
  }
  .sidebar.open{left:0}
  .menu-toggle{display:flex}
  .main{padding:80px 24px 40px}
  .hero .title{font-size:48px}
}
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="menu-toggle" id="menuToggle">☰</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>道德经</h1>
      <div class="sub"> 宇 松 版 </div>
      <div class="note">（不可商用 仅限自用）</div>

    <div id="navList"></div>
  </aside>

  <main class="main">
    <section class="hero">
      <div class="title">道 德 经</div>
      <div class="divider"></div>
      <div class="subtitle">宇松版</div>
      <p class="desc" style="margin-top:24px">

      </p>
    </section>
    <div id="chaptersContainer"></div>
  </main>
</div>

<div class="back-top" id="backTop">↑</div>

<script>
// ===== 章节数据占位（由脚本注入）=====
const CHAPTERS = [{"section": "道经", "title": "第一章", "pairs": [["道，可道，非常道；名，可名，非常名。", "道，如果可以用语言符号的概念表述，那就不是永恒不变的道了；名，如果可以用语言符号的概念来界定，那就不是永恒不变的名了。"], ["无名，天地之始；有名，万物之母。", "“无”，用来指称自然系统的存在的本体本身；“有”，用来指称万物的起始。"], ["故常无欲，以观其妙；常有欲，以观其徼（jiào）。", "因此，恒常保持自得无缺的状态，以观照道的精微幽眇；恒常保有好奇心的观照，以观照道的显现、边界、归宿。"], ["此两者同出而异名，同谓之玄。", "“无”和“有”这二者，同出一源而名称相异，都可以说是幽深玄远的。"], ["玄之又玄，众妙之门。", "幽深而又幽深，这是一切精微变化的出入之门。"]]}, {"section": "道经", "title": "第二章", "pairs": [["天下皆知美之为美，斯恶（wù）矣；皆知善之为善，斯不善矣。", "当天下人都认定某种美是美的时候，是因为有丑的存在；都认定某种善是善的时候，那不善也便由此而生了。"], ["故有无相生，难易相成，长短相较，高下相倾，音声相和，前后相随。", "所以说，有与无相互生成，难与易相互成就，长与短相互显现，高与下相互倾倚，音与声相互应和，前与后相互追随。"], ["是以圣人处无为之事，行不言之教，", "因此，得道者以不造作、不勉强来行事，以不立名相符号的教化来施行。"], ["万物作焉而不辞，生而不有，为而不恃（shì），功成而弗居。", "万物兴起生发，他不去干涉推拒；生化万物，却不据为己有；有所作为，却不执持；大功告成，却不居守其功。"], ["夫唯弗居，是以不去。", "正因他不居守、不占有，所以那“无所得之德”才不会从他那里流散离去。"]]}, {"section": "道经", "title": "第三章", "pairs": [["不尚贤，使民不争；不贵难得之货，使民不为盗；不见（xiàn）可欲，使民心不乱。", "不标榜贤能的名位，百姓便不会因此争夺；不珍视难能可贵的财物，百姓便不会因此行窃；不显露足以引动贪欲的事物，百姓的心思便不会因此惑乱。"], ["是以圣人之治，虚其心，实其腹，弱其志，强其骨。", "因此，得道者治理天下，是让百姓的心怀变得不被迷乱，让百姓的腹肚得以充实饱足，让百姓的竞争野心变得削弱，让百姓的筋骨体魄变得强健。"], ["常使民无知无欲。使夫智者不敢为也。为无为，则无不治。", "恒常使百姓处于不自以为是、不生起妄欲的状态。使那些自以为是的人不敢妄自造作、勉强。持守这不造作、不勉强的法则来行事，天下便没有治理不好的。"]]}, {"section": "道经", "title": "第四章", "pairs": [["道冲，而用之或不盈。", "道，是虚空无形的，但它所起的作用却无穷无尽。"], ["渊兮，似万物之宗；", "深幽啊，像是万物的祖宗；"], ["挫其锐，解其纷，和其光，同其尘；", "磨损那锋芒，化解那纷争，调和自以为是的明耀，混同自以为贵于尘世。"], ["湛（zhàn）兮，似或存。", "沉潜隐没啊，像是有又像是无。"], ["吾不知谁之子，象帝之先。", "我不知道它是谁所生之子，它似乎在天帝出现之前就已经存在。"]]}, {"section": "道经", "title": "第五章", "pairs": [["天地不仁，以万物为刍狗；", "自然系统不偏私偏爱，视万物如同一次性祭品，任其自生自灭；"], ["圣人不仁，以百姓为刍狗。", "得道者不偏私偏爱，同样视百姓如同一次性祭品；"], ["天地之间，其犹橐龠（tuó yuè）乎？", "天地之间，不就像一个风箱吗？"], ["虚而不屈，动而愈出。", "虚空而不枯竭，鼓动则风愈出。"], ["多言数穷，不如守中。", "多执迷于语言符号，只会加速穷困败亡，不如持守虚静之中道。"]]}, {"section": "道经", "title": "第六章", "pairs": [["谷神不死，是谓玄牝（pìn）。", "如山谷般虚空卑下的运化，永存不死，这就是幽远深妙的母体。"], ["玄牝之门，是谓天地根。", "这幽远母体的产育之门，就是自然系统的根源。"], ["绵绵若存，用之不勤。", "它连绵不绝，似有似无地存在着，但它的作用却永不枯竭。"]]}, {"section": "道经", "title": "第七章", "pairs": [["天长地久。", "自然系统是长久的。"], ["天地所以能长且久者，以其不自生，故能长生。", "自然系统之所以能够长久存在，是因为它活出自己的本来面目，不为自己再造作增生，所以才能长久。"], ["是以圣人后其身而身先；外其身而身存。", "因此，得道者把自己置身后位，反而能领先；把自己置身度外，反而能存全。"], ["非以其无私邪（yé）？故能成其私。", "这难道不正因为他没有私心吗？所以反而成就了他自身的成全。"]]}, {"section": "道经", "title": "第八章", "pairs": [["上善若水。", "善于行道的最高境界，就如同水一样。"], ["水善利万物而不争，处众人之所恶，故几于道。", "水善于滋养万物而不与万物相争，停留在大家所厌恶的低洼之处，所以最接近道。"], ["居善地，心善渊，与善仁，言善信，政善治，事善能，动善时。", "安处于能善于发挥本性之地，心胸善于保持沉静，与人相处善于真诚恰当，言谈善于守信，为政善于随本性而治，行事善于做能做的事，行动善于择机而动。"], ["夫唯不争，故无尤。", "正因为不与万物相争，所以不会招致过失怨咎。"]]}, {"section": "道经", "title": "第九章", "pairs": [["持而盈之，不如其已；", "执持而使它盈满，不如适可而止；"], ["揣而锐之，不可长保。", "捶击而使它锐利，那锋芒不能长久保持。"], ["金玉满堂，莫之能守；", "金玉堆满堂室，谁能够长久守住呢？"], ["富贵而骄，自遗其咎。", "富贵而又骄横，一定会给自己留下祸殃。"], ["功遂身退，天之道！", "功业成就，及时抽身退后，这就是自然系统的运行法则！"]]}, {"section": "道经", "title": "第十章", "pairs": [["载营魄抱一，能无离乎？", "身心抱守合一那自得之本性，能使之不相分离吗？"], ["专气致柔，能婴儿乎？", "专注气息，使之柔和，能如同婴儿一样吗？"], ["涤除玄鉴，能无疵乎？", "洗去妄念尘垢，使那幽深如镜的觉察，能达到没有瑕疵吗？"], ["爱民治国，能无为乎？", "爱养百姓，治理国家，能做到不造作、不勉强吗？"], ["天门开阖（hé），能为雌乎？", "感官开合，能如同雌性那样宁静退守吗？"], ["明白四达，能无知乎？", "明白通达各种事理，能达到不自以为是吗？"], ["生之畜（xù）之，生而不有，为而不恃，长而不宰，是谓玄德。", "道生养、容蓄万物，而不据为己有，有所作为而不执持，任其生长而不主宰，这就是幽深玄远的“无所得之德”。"]]}, {"section": "道经", "title": "第十一章", "pairs": [["三十辐共一毂（gǔ），当其无，有车之用。", "三十根辐条汇聚在一个车毂上，正因为车毂中有虚空，才有了车子的功用。"], ["埏埴（shān zhí）以为器，当其无，有器之用。", "揉和黏土制成器皿，正因为器皿中有虚空，才有了器皿的功用。"], ["凿户牖（yǒu）以为室，当其无，有室之用。", "开凿门窗建造居室，正因为居室中有虚空，才有了居室的功用。"], ["故有之以为利，无之以为用。", "所以说，“有”给人以某些便利的效果，而“无”却发挥了真正的作用。"]]}, {"section": "道经", "title": "第十二章", "pairs": [["五色令人目盲；五音令人耳聋；五味令人口爽；", "五色缤纷使人视觉昏盲；五音繁杂使人听觉失辨；五味厚腻使人味觉伤败；"], ["驰骋畋（tián）猎，令人心发狂；", "纵马疾驰、围猎追逐，使人心性狂乱躁动；"], ["难得之货，令人行妨。", "难以获得的珍稀货物，使人行动不便，或迷失而铤而走险。"], ["是以圣人为腹不为目，故去彼取此。", "因此得道者只要能获得的基本所需，不追逐可有可无的东西，所以舍弃那可有可无的，选取这根本啊！"]]}, {"section": "道经", "title": "第十三章", "pairs": [["宠辱若惊，贵大患若身。", "得宠与受辱，都如同受到惊恐一样。重视大的祸患，如同重视自己的身体一样。"], ["何谓宠辱若惊？宠为下，得之若惊，失之若惊，是谓宠辱若惊。", "什么叫做“宠辱若惊”？得宠是卑下的事，得到它时感到惊喜不安，失去它时感到惊恐不安，这就叫得宠与受辱都如同受惊一样。"], ["何谓贵大患若身？吾所以有大患者，为吾有身，及吾无身，吾有何患？", "什么叫做“贵大患若身”？我之所以有大祸患，是因为我试图占有这个无法被完全控制的身体；如果我不试图占有这个身不由己的身体，我还会有什么祸患呢？"], ["故贵以身为天下，若可寄天下；爱以身为天下，若可托天下。", "因此，重视自身是被天地万有组合而生，才可寄生于天下；以爱对待相对于天地万有而渺小的自己，才可以把自己托付于天下。"]]}, {"section": "道经", "title": "第十四章", "pairs": [["视之不见，名曰夷；听之不闻，名曰希；搏之不得，名曰微。", "看它却看不见，这叫做“夷”；听它却听不到，这叫做“希”；抓取它却触不着，这叫做“微”。"], ["此三者不可致诘，故混而为一。其上不皦（jiǎo），其下不昧。", "这三者无法进一步追问追究，所以把它们混同为一体。它的上面不明亮耀眼，它的下面不暗昧幽黑。"], ["绳绳兮不可名，复归于无物。", "绵延不绝，无法言喻啊，最终又回归于无形无用的状态。"], ["是谓无状之状，无物之象，是谓惚恍。", "这就是没有形状的状况，没有作用的现象，这就叫做“惚恍”。"], ["迎之不见其首，随之不见其后。", "迎着它，看不见它的前头；跟随它，看不见它的背后。"], ["执今之道，以御今之有。能知古始，是谓道纪。", "把握当今的道，来驾驭当下的一切实有。能够贯通初始，这就叫做道的规律。"]]}, {"section": "道经", "title": "第十五章", "pairs": [["古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：", "古时善于行道的人，低微又通达，无法被常人认识。正因为他无法被认识，所以只能勉强为他形容一番："], ["豫兮，若冬涉川；犹兮，若畏四邻；俨（yǎn）兮，其若客；", "他谨慎啊，就像冬天踏冰过河；他警觉啊，就像畏惧四方邻国；他庄重啊，就像在外做客；"], ["涣兮，若冰之将释；敦兮，其若朴；旷兮，其若谷；混兮，其若浊。", "他释然啊，就像冰块将要消融；他敦厚啊，就像未经雕凿的原木；他空阔啊，就像山谷一样虚怀；他混同啊，就像混浊的水流。"], ["孰能浊以止？静之徐清；孰能安以久？动之徐生。", "谁能在混浊中安住？虚静而慢慢澄清；谁能在安定中持久？而慢慢生发活力。"], ["保此道者，不欲盈。夫唯不盈，故能蔽不新成。", "持守此道的人，不追求完满。正因为他不求完满，所以能够安于本来面目的残缺美（而不过满生损），历久而常新。"]]}, {"section": "道经", "title": "第十六章", "pairs": [["致虚极，守静笃，万物并作，吾以观复。", "虚静的到达，是极致恒久的，持守虚静坚定专一。万物蓬勃生发，我由此观察它们（生灭无常、循环往复的规律以及）回归本源的趋势。"], ["夫物芸芸，各复归其根。", "万物纷纷芸芸，各自回归其（依赖多种因素共同作用而非固定本性的“无”之）本根。"], ["归根曰静，是曰复命。", "这叫做，回归超越符号、本然而沉寂的根源——“虚静”，这又被称为返回本来面目。"], ["复命曰常，知常曰明。", "返回本来面目叫做“永恒法则”，知晓这永恒法则叫做“明智”。"], ["不知常，妄作凶。", "不知这永恒法则，轻举妄动，就会招致凶祸。"], ["知常容，容乃公，公乃全，全乃天，天乃道，道乃久，没身不殆。", "知晓永恒法则，便能无所不包。能包容才能不偏不倚，不偏不倚才能周全，周全才能符合天性，符合天性才能合于道，合于道才能长久，终身不会极度危险。"]]}, {"section": "道经", "title": "第十七章", "pairs": [["太上，下知有之；其次，亲而誉之；", "最上的，只是知晓有其存在；次一等的，亲近赞誉他；"], ["其次，畏之；其次，侮（wǔ）之。", "再次一等的，畏惧他；更次一等的，侮慢他。"], ["信不足焉，有不信焉，", "诚信不足，就有了不会被信任的情况。"], ["犹兮其贵言。功成事遂，百姓皆谓\"我自然\"。", "以谋略般谨慎的态度来重视语言符号啊！功业成就，事情遂行，大家都说“我们本来就是这样的”！"]]}, {"section": "道经", "title": "第十八章", "pairs": [["大道废，有仁义；", "大道衰废，（因为）有了被标榜的社会规范；"], ["智慧出，有大伪；", "机巧算计的伪智出现，（因为）有了严重的虚伪与造假；"], ["六亲不和，有孝慈；", "家族之间失去和睦，（因为）有了子孝父慈的教条；"], ["国家昏乱，有忠臣。", "政治昏乱，（因为）有了忠臣奸臣这概念的体现。"]]}, {"section": "道经", "title": "第十九章", "pairs": [["绝圣弃智，民利百倍；", "断绝人为规训的模范，抛弃机巧算计的伪智，百姓反而能得到百倍的利益；"], ["绝仁弃义，民复孝慈；", "断绝人为标榜的仁，抛弃人为设定的义，百姓反而能恢复天然的子孝父慈；"], ["绝巧弃利，盗贼无有。", "断绝功能本身之外的取巧，抛弃逐利的标榜，盗贼便自然不会产生。"], ["此三者以为文不足，故令有所属：", "这三者作为表面条文尚且不够，所以要有所依归："], ["见（xiàn）素抱朴，少私寡欲。", "外现本色的素丝之身，内守未经雕凿的原木之心；（因为一切事物都依赖多种因素的共同作用，不如回归本来面目）少看重自己，少欲求自己无法控制的。"]]}, {"section": "道经", "title": "第二十章", "pairs": [["绝学无忧。", "断绝“得到”的机巧学识，便没有忧患。"], ["唯之与阿，相去几何？善之与恶，相去几何？人之所畏，不可不畏？", "赞成与反对，能相差多少？好的与不好的，又能相隔多远？世人所畏惧的，难道就不得不畏惧吗？"], ["荒兮，其未央哉！", "从古至今如此啊，似乎永无尽头！"], ["众人熙熙，如享太牢，如春登台。我独泊兮其未兆，如婴儿之未孩。傫傫兮，若无所归。", "人群聚在一起，如同参加盛宴，如同春天登台远眺那般兴高采烈。唯独我淡泊宁静，没有任何征兆，就像还不会发笑的婴儿。疲惫闲散啊，好像无家可归。"], ["众人皆有余，而我独若遗。我愚人之心也哉，沌沌兮！", "大家都富足有余，唯独我好像有所缺失。我真是愚人的心肠啊，混沌无知！"], ["俗人昭昭，我独昏昏。俗人察察，我独闷闷。", "落俗之人都光芒四射，唯独我昏昧暗淡。落俗之人都精明苛察，唯独我闷声不响。"], ["澹（dàn）兮其若海，飂（liǜ）兮若无止。", "辽阔动荡啊，像大海一样；飘荡无定啊，像疾风一样不知道什么时候止息。"], ["众人皆有以，而我独顽似鄙。", "大家都有各自的本领，唯独我愚顽不灵。"], ["我独异于人，而贵食母。", "唯独我与世俗众人不同，因为我珍重那滋养万物的根本母体——道。"]]}, {"section": "道经", "title": "第二十一章", "pairs": [["孔德之容，惟道是从。", "空大之德的样态，完全依随于道。"], ["道之为物，惟恍惟惚。", "若道成为作用，只是隐隐约约、模模糊糊。"], ["惚兮恍兮，其中有象；恍兮惚兮，其中有物；", "模糊啊！隐约啊！其中却藏着万有的原始蓝图；隐约啊！模糊啊！其中却藏着万有的原始材料；"], ["窈（yǎo）兮冥兮，其中有精；其精甚真，其中有信。", "深远啊！暗昧啊！其中却有微妙的本体——存在本身！这本体极其真实，其中有着绝对实在。"], ["自古及今，其名不去，以阅众父。", "从古到今，无名不曾消去，以此观照万物的本始之父。"], ["吾何以知众父之状哉？以此。", "我凭什么知晓万物本始之父的状态呢？就是凭这个。"]]}, {"section": "道经", "title": "第二十二章", "pairs": [["曲则全，枉则直，洼则盈，敝（bì）则新，少则得，多则惑。", "委曲反而能得以保全，弯曲反而能得以伸直，低洼反而能得以充盈，破旧反而能得以更新，少取反而能得以获得，贪多反而会令人迷惑。"], ["是以圣人抱一为天下式。", "因此，得道者将这“一”（这根基、这自得之本性）作为处世的准则。"], ["不自见，故明；不自是，故彰；不自伐，故有功；不自矜，故长。", "不自我显现，所以才能显明；不自以为是，所以才能彰显；不自我夸耀，所以才能有功；不自负矜持，所以才能长久。"], ["夫唯不争，故天下莫能与之争。", "正因为不与任何人相争，所以天下没有人能与他相争。"], ["古之所谓\"曲则全\"者，岂虚言哉？诚全而归之。", "古人所说的“委曲反而能得以保全”，难道是空话吗？确实能使人归于保全之道。"]]}, {"section": "道经", "title": "第二十三章", "pairs": [["希言自然。", "少沉迷于语言符号，才合于本来面目。"], ["故飘风不终朝，骤雨不终日。", "所以狂风不可能天天刮，暴雨不可能日夜下。"], ["孰为此者？天地。天地尚不能久，而况于人乎？", "是谁制造了狂风暴雨？是自然系统。自然系统的激烈运动尚且不能长久，何况是人呢？"], ["故从事于道者同于道，德者同于德，失者同于失。", "因此，依循存在本身——本源与回归而行事的人，就能与存在本身——本源与回归合一；依循所自得之本性而行事的人，就能与所自得之本性合一；失道失得，就自作自受地失去。"], ["同于道者，道亦乐得之；同于德者，德亦乐得之；同于失者，失亦乐得之。", "与道合一的人，道也乐意得到他；与得合一的人，得也乐意得到他；与失合一的人，失也乐意得到他。"], ["信不足焉，有不信焉。", "信心不足，即使是真实的，也不会信任。"]]}, {"section": "道经", "title": "第二十四章", "pairs": [["企者不立，跨者不行。", "踮起脚跟的人，反而站不牢稳；大步跨越的人，反而走不长远。"], ["自见者不明，自是者不彰，自伐者无功，自矜者不长。", "自我显现的，反而不能显明。自以为是的，反而不能彰显。自我夸耀的，反而没有功劳。自负矜持的，反而不能长久。"], ["其在道也，曰余食赘赘（zhuì）行。", "从道的视角来看，这些行为就像是吃剩的饭食和身上多余的赘瘤。"], ["物或恶之，故有道者不处。", "万物尚且厌恶这些东西，所以有道的人绝不以此自处。"]]}, {"section": "道经", "title": "第二十五章", "pairs": [["有物混成，先天地生。", "有一种作用浑然而成，先于自然系统而存在。"], ["寂兮寥兮，独立不改，周行而不殆，可以为天下母。", "它无声无形啊，是（存在本身不干预存在的状态，而勉强可看作）统一的独存本体，（因一直在变动）而（“无”之本体，没有固定的本质）没有什么改变，周遍运行而不止息，可以作为天地万物的母体。"], ["吾不知其名，强字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。", "我不知道它本来的名字，勉强给它取字叫做“道”，勉强给它命名叫做“大”。大就是运行不息，运行不息就是渐行渐远，渐行渐远又是会反向回归到本源。"], ["故道大，天大，地大，王亦大。域中有四大，而王居其一焉。", "所以，道本来是大（运行不息、渐行渐远、回归本源），天和道一样是大，地和道一样是大，得道者和道一样也是大。宇宙之中有四种“大”，而得道者也只是其中之一。"], ["人法地，地法天，天法道，道法自然。", "人效法于有形，有形效法于无形，无形效法于存在本身，存在本身效法于一切的本来面目。"]]}, {"section": "道经", "title": "第二十六章", "pairs": [["重为轻根，静为躁君。", "厚重是轻浮的根本，虚静是躁动的主宰。"], ["是以圣人终日行不离辎重，虽有荣观，燕处超然。", "因此，得道者处世，就像行军离不开途中所需的粮食、装备。虽然世上有着美景奇观和华丽的宫阙居所，却能安居自身处境而超然物外。"], ["奈何万乘之主而以身轻天下？", "为什么拥有万乘兵车的君主，（却以追逐美景奇观和华丽的宫阙居所那般）而以轻浮躁动来治理天下呢？"], ["轻则失根，躁则失君。", "轻浮就会失去根本，躁动就会失去自主。"]]}, {"section": "道经", "title": "第二十七章", "pairs": [["善行，无辙（zhé）迹；善言，无瑕谪（zhé）；善数，不用筹策；善闭，无关楗（jiàn）而不可开；善结，无绳约而不可解。", "善于行路的，不留下行路痕迹；善于言说的，不留下把柄瑕疵；善于计算的，不用计算工具；善于关闭的，不用锁钥却使人无法打开；善于捆缚的，不用绳索约束却使人无法解开。（低微的无用反而可以得以保全）"], ["是以圣人常善救人，故无弃人；常善救物，故无弃物。是谓袭明。", "因此，得道者总是善于洞悉其无用之用，救助弃人，所以没有被遗弃的人；总是善于洞悉其无用之用，救助弃物，所以没有被废弃的物。这就叫做承袭道的明智。"], ["故善人者，不善人之师；不善人者，善人之资。", "所以，善于行道之人是不善于行道之人的老师；不善于行道之人是善于行道之人的资粮借鉴。"], ["不贵其师，不爱其资，虽智大迷。是谓要妙。", "不珍视自己的老师，不爱惜自己的资鉴，虽然自以为聪明，其实是大迷惑。这就叫做“微妙的道理”。"]]}, {"section": "道经", "title": "第二十八章", "pairs": [["知其雄，守其雌，为天下谿（xī）。为天下谿，常德不离，复归于婴儿。", "深知雄强的力量，却安守雌柔，成为天下最低处的溪谷。成为天下最低处的溪谷，恒常所自得之本性就不会离失，回归到婴儿般的纯真状态。"], ["知其白，守其黑，为天下式。为天下式，常德不忒（tè），复归于无极。", "深知光明的显耀，却安守暗昧的位置，为处世的准则。成为处世的准则，恒常所自得之本性就不会出差错，回归到无极至虚的状态。"], ["知其荣，守其辱，为天下谷。为天下谷，常德乃足，复归于朴。", "深知荣宠的尊贵，却安守屈辱的位置，成为天下虚空的山谷。成为天下虚空的山谷，恒常所自得之本性才能充足丰满，回归到原木般的质朴状态。"], ["朴散则为器，圣人用之，则为官长。", "原木般的质朴分散开来，便成为具体的器物，得道者顺应万物的本性去处世，就成为百官之长。"], ["故大制不割。", "所以，最完善的规制是不割裂万物的本性。"]]}, {"section": "道经", "title": "第二十九章", "pairs": [["将欲取天下而为之，吾见其不得已。", "想要夺取天下来加以强行造作、勉强，我看他达不到目的。"], ["天下神器，不可为也。", "天下是神秘莫测的器物，不可以强行造作、勉强。"], ["为者败之，执者失之。", "强行造作、勉强的人必然失败，执持把捉的人必然丧失。"], ["故物或行或随，或歔（xū）或吹，或强或羸，或载或隳（huī）。", "因为万物有的前，有的后；有的气息缓和，有的气息急促；有的强，有的弱；有的自载存续，有的自毁而去。"], ["是以圣人去甚、去奢、去泰。", "因此，圣人去除过度的极端、去除奢侈的铺张、去除骄泰的傲慢。"]]}, {"section": "道经", "title": "第三十章", "pairs": [["以道佐人主者，不以兵强天下，其事好还。", "用道来辅佐君主的人，不靠武力在天下强为，强为这件事很容易返回到自己身上。"], ["师之所处，荆棘生焉；大军之后，必有凶年。", "军队驻扎过的地方，荆棘丛生；大战之后，必定会有灾荒的年景。"], ["善者果而已，不敢以取强。", "善于用兵的人，只求达到成效就停手，不敢凭借武力来逞强夺霸。"], ["果而勿矜，果而勿伐，果而勿骄，果而不得已，果而勿强。", "达到成效却不自负矜持；达到成效却不自我夸耀；达到成效却不自我骄傲；达到成效却是出于不得已；达到成效却不逞强凌人。"], ["物壮则老，是谓不道，不道早已。", "万事万物过于壮大就会走向衰退，这就叫做不合于道，不合于道就会早早终结。"]]}, {"section": "道经", "title": "第三十一章", "pairs": [["夫为兵者，不祥之器。物或恶之，故有道者不处。", "“兵”这种强为的东西，是不祥的器物。万物都厌恶它，因此有道的人绝不轻易使用它。"], ["君子居则贵左，用兵则贵右。兵者，不祥之器，非君子之器，不得已而用之。", "君子平日居处以左边为尊贵，纷争时则以右边为尊贵。强为的兵器，是不祥的器物，不是君子该用的器物，只有在万不得已时才使用它。"], ["恬淡为上，胜而不美，而美之者，是乐杀人。夫乐杀人者，则不可得志于天下矣。", "心境淡漠、不热衷于此才是上策。即便打了胜仗，也不觉得美好。如果觉得胜仗美好，那就是以杀人为乐事。凡是乐于杀人的人，不可能在天下实现其志向。"], ["吉事尚左，凶事尚右；偏将军居左，上将军居右。言以丧礼处之。", "吉祥的事情以左边为上，凶丧的事情以右边为上。在军阵中，地位偏低的偏将军站在左边，地位高的上将军却站在右边，这就是说要以看待丧礼的看法来应对用兵打仗。"], ["杀人之众，以哀悲莅（lì）之；战胜，以丧礼处之。", "战争中杀人众多，以悲痛的态度来对待；打了胜仗，要用丧礼的仪式来处置。"]]}, {"section": "道经", "title": "第三十二章", "pairs": [["道常无名，朴虽小，天下莫能臣也。", "道是恒常的，无法用语言符号的概念界定，原木般的本来面目虽然微不足道，天下却没有谁能使之臣服。"], ["侯王若能守之，万物将自宾。", "统治者如果能够持守此道，万物将自会安于他们的本性。"], ["天地相合，以降甘露，民莫之令而自均。", "地与天阴阳相合（上位者主动降低有为姿态，而以无为姿态推举下位，不割裂其本性），便降下甘露，百姓无需命令，就自然惠及所有人，使其各得其所。"], ["始制有名，名亦既有，夫亦将知止，知止可以不殆（dài）。", "万物化生，开始有了语言符号的概念的分辨。能指既然已经产生，也要知道适可而止。知道止于语言符号的概念的局限性以及所指向的根本，就可以避免危殆。"], ["譬道之在天下，犹川谷之于江海。", "打个比方：道存于天下，就像溪谷的水流最终归趋于江海一样。"]]}, {"section": "道经", "title": "第三十三章", "pairs": [["知人者智，自知者明。", "能够了解别人的人，叫做机智；能够认识自己的人，才叫做明白。"], ["胜人者有力，自胜者强。", "能够战胜别人的人，叫做有力量；能够战胜自己的人，才叫做真正的强大。"], ["知足者富，强行者有志？", "知道满足（不贪求无法控制的东西）的时候才是真正的富有，难道因为不知足而硬来的时候就是有志向？"], ["不失其所者久，死而不亡者寿？", "（因生死都归属于那本体）不丧失本来面目的状态就像存在本身那般久远，生者都要走向死亡却硬要维系不使其故去的状态就是长寿？"]]}, {"section": "道经", "title": "第三十四章", "pairs": [["大道泛兮，其可左右。", "大道广泛流布啊，左右上下无处不在。"], ["万物恃之以生而不辞，功成而不名有，衣养万物而不为主。", "万物依赖它生长，它却不加干涉推拒；大功告成，却无法用语言符号表述有什么；覆盖庇护并滋养万物，它却不做万物的主宰。"], ["常无欲，可名于小；万物归焉而不为主，可名于大。", "它恒常处于自足无缺的境地，可以称之为“小”；万物都归趋于它，它仍不自以为主宰，可以称之为“大”。"], ["以其终不自为大，故能成其大。", "正因为它始终不自以为大，所以反而能成就它真正的大。"]]}, {"section": "道经", "title": "第三十五章", "pairs": [["执大象，天下往。往而不害，安平太。", "执守大道这个原始蓝图，天下万物自会归往。归往而又不互相伤害，便会安宁平和。"], ["乐与饵，过客止。", "音乐与美食，能让过路的人停下脚步。"], ["道之出言，淡乎其无味。", "而道从口中说出，平淡得没有任何味道。"], ["视之不足见，听之不足闻。", "看它，不足以看见什么形象；听它，不足以听到什么声音。"], ["用之不足既。", "但使用它，却无穷无尽啊！"]]}, {"section": "道经", "title": "第三十六章", "pairs": [["将欲歙（xī）之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲夺之，必固与之。", "想要收敛它，必须先让它扩张；想要削弱它，必须先让它强盛；想要废弃它，必须先让它兴盛；想要夺取它，必须先给予它。"], ["是谓微明：柔弱胜刚强。", "这就叫做幽微的明智：柔弱能够战胜刚强。"], ["鱼不可脱于渊，国之利器不可以示人。", "鱼不能脱离深渊，如同国家即使有可以伤人的取胜手段，也不能指示于人。"]]}, {"section": "道经", "title": "第三十七章", "pairs": [["道常无为，而无不为。", "因为存在本身永远不造作、不勉强，所以没有什么是它不能做到的。"], ["侯王若能守之，万物将自化。", "统治者如果能够持守此道，万物将会自行生长变化。"], ["化而欲作，吾将镇之以无名之朴。", "我、统治者与万物在自行生长变化之中，若有造作、勉强的妄欲，吾就用超越语言符号的概念的本来面目（还本来面目以本来面目）来使之安定。"], ["无名之朴，夫亦将无欲。", "这超越语言符号的概念的本来面目，也将使其不再产生造作、勉强的妄欲。"], ["不欲以静，天下将自定。", "没有造作、勉强的妄欲而归于虚静，天下将会自己安定。"]]}, {"section": "德经", "title": "第三十八章", "pairs": [["上德不德，是以有德；下德不失德，是以无德。", "最高级的得（知道一切依赖多种因素而存在，“无所得之德”）就是实无所得，所以才是真正的有得；低层次的德，不愿失去所得，所以实无所得。"], ["上德无为而无以为；下德为之而有以为。", "最高级的得，不勉强、不造作，也无意于作为；低层次的得，刻意勉强、造作，而且是有意作为。"], ["上仁为之而无以为；上义为之而有以为。", "被推崇的仁，虽然有所作为，但不觉得有什么；被推崇的义，有所作为，也认为有什么。"], ["上礼为之而莫之应，则攘臂而扔之。", "被推崇的礼，刻意强求推行，如果没人响应，就撸起袖子、伸出胳膊去拉拽人服从。"], ["故失道而后德，失德而后仁，失仁而后义，失义而后礼。", "所以，丧失了道，然后才强调得；丧失了得，然后才强调仁；丧失了仁，然后才强调义；丧失了义，然后才强调礼。"], ["夫礼者，忠信之薄，而乱之首。", "礼这个东西，标志着忠实诚信的淡薄，是祸乱的开端。"], ["前识者，道之华，而愚之始。", "所谓自以为是的先见之明，不过是道的浮华外饰，也是愚昧的开始。"], ["是以大丈夫处其厚，不居其薄；处其实，不居其华。", "故去彼取此。"], ["因此，得道者立身根本本体的淳厚，不居于可有可无的浅薄；立身本来面目，不居于浮华的面具。所以，要舍弃浅薄与浮华，选取淳厚与朴实。", ""]]}, {"section": "德经", "title": "第三十九章", "pairs": [["昔之得一者：", "往昔那得到“一”（存在本身所赋予的，那浑然未分的统一的、低微的根基——自得之本性）的状态是这样的："], ["天得一以清；地得一以宁；神得一以灵；谷得一以盈；万物得一以生；侯王得一以为天下贞。", "天空得本性而清明；大地得本性而安稳；心神意识得本性而灵敏；山谷得本性而水源充盈；万物得本性而生长不息；统治者得本性而成为天下的首领。"], ["其致之：天无以清，将恐裂；地无以宁，将恐发；神无以灵，将恐歇；谷无以盈，将恐竭；万物无以生，将恐灭；侯王无以贵高，将恐蹶（jué）。", "推而言之：天空的大气层没了清明的根源，恐怕气体循环就要断裂；大地没了安稳宁静的根源，恐怕就要崩废；心神意识没了灵敏的根源，恐怕就要停歇；山谷没了充盈的根源，恐怕就要干涸；万物没了生存繁衍的根源，恐怕就要灭绝；统治者没了能让他保持尊贵高位的根源，恐怕就要倾覆垮台。"], ["故贵以贱为本，高以下为基。是以侯王自称孤、寡、不穀（gǔ）。此非以贱为本邪？非乎？", "所以，尊贵以卑贱作为根本，高峻以下方作为基础。因此侯王用“孤独”、“寡德”、“不善”这样卑贱的称呼来自称。这不就是以卑贱为根本吗？难道不是吗？"], ["故至数舆无舆（yú），不欲琭琭（lù）如玉，珞珞如石。", "所以，最高的声誉是无需赞誉的。因此，不想要追求像华美的宝玉那样尊贵，而宁肯像粗糙的石头那样坚实卑微。"]]}, {"section": "德经", "title": "第四十章", "pairs": [["反者道之动，弱者道之用。", "循环往复、回归本源，是道的动态（物极必反的相）；柔弱微细，是道的运用（反向运动的用）。"], ["天下万物生于有，有生于无。", "天下万物从“有”（万物的起始、存在状态）中产生，而“有”从“无”（存在的本体本身）中产生。"]]}, {"section": "德经", "title": "第四十一章", "pairs": [["上士闻道，勤而行之；中士闻道，若存若亡；下士闻道，大笑之。不笑，不足以为道。", "禀赋上等的人听闻了存在本身（道），会勤勉地践行；禀赋中等的人听闻了道，有时记得有时忘，将信将疑；禀赋下等的人听闻了道，会大笑。不被这种人笑话，那就不足以称之为道。"], ["故建言有之：明道若昧，进道若退，夷道若颣（lèi）；", "所以古语立说的人曾说：光明的道，看起来像是暗昧的；前进的道，看起来像是后退的；平坦的道，看起来像是崎岖的。"], ["上德若谷，大白若辱，广德若不足，建德若偷，质真若渝；", "最高的“无所得之德”，如同山谷一样虚空卑下；最洁白的东西，反而像是受了污辱；广大的得，反而好像有所欠缺；刚健的得，反而好像懈怠懒惰；纯真质朴的本来面目，反而好像变了质。"], ["大方无隅（yú），大器免成，大音希声，大象无形；道隐无名。", "最大的方正的没有棱角，最大的器物免于造作而成，最大的声音几乎听不见，最大的形象没有形状。道本身就是隐而不显的，无法用语言符号来命名。"], ["夫唯道，善贷且成。", "然而只有道，善于施与并成就一切。"]]}, {"section": "德经", "title": "第四十二章", "pairs": [["道生一，一生二，二生三，三生万物。", "“道（存在本身）”使那（浑然未分的统一整体之根基、本性之）“一”存在；这个“一”产生了“二”（“能知主体、被言说对象”的区分）；（“整体、能知主体、被言说对象”的）“三”生出了（被命名的）万物。"], ["万物负阴而抱阳，冲气以为和。", "（被命名的）万物都背离（逃避）着阴（灭），而怀抱（向往）着阳（生）；用中虚（万物矛盾交冲、生灭无常而成就本体中虚）​的运化成就（大道的）混同。"], ["人之所恶（wù），唯孤、寡、不穀（gǔ），而王公以为称。", "人们所厌恶的，不过是“孤独”、“寡德”、“不善”这些卑下的称呼，可王公们却拿来自称。"], ["故物，或损之而益，或益之而损。", "所以事物减损到一定程度，反而会增益；增益到一定程度，反而会减损。"], ["人之所教，我亦教之：强梁者不得其死。吾将以为教父。", "别人教导我的，我也拿来教导人：强取的人不得好死。我把这句话作为施教的根本宗旨。"]]}, {"section": "德经", "title": "第四十三章", "pairs": [["天下之至柔，驰骋（chěng）天下之至坚。", "天下最柔弱的东西（道的循环往复和低微），反而能穿透、驾驭天下最坚硬的东西。"], ["无有入无间，吾是以知无为之有益。", "无形无体的东西（道的本来面目和循环往复），能够穿过、融入没有缝隙的东西，我因此知道不造作、不勉强的好处。"], ["不言之教，无为之益，天下希及之。", "不用语言符号的教化，不造作、不勉强的“无所得之德”的益处，天下很少有人能做到。"]]}, {"section": "德经", "title": "第四十四章", "pairs": [["名与身孰亲？身与货孰多？得与亡孰病？", "被符号概念建构的名与自身，哪个与你更亲近？自身与财物，哪个更贵重？得到枝节的与失去根本的，哪个更有害？"], ["是故甚爱必大费，多藏必厚亡。", "因此，（未得到时）过分的贪爱什么，必然导致巨大的耗费；（得到时）过多的贮藏什么，必然在失去时，招致更惨重的损失。"], ["知足不辱，知止不殆（dài），可以长久。", "知道满足（不贪求无法控制的东西），便不会遭受屈辱；知道适可而止（于语言符号的概念、于占有欲的边界），便不会遇到危险；这样，才能长久地回归于本来面目中。"]]}, {"section": "德经", "title": "第四十五章", "pairs": [["大成若缺，其用不弊。", "最圆满的，看起来好像有所欠缺，但它的作用却永不衰竭。"], ["大盈若冲，其用不穷。", "最充盈的，看起来好像虚空一样，但它的作用却无穷无尽。"], ["大直若屈，大巧若拙，大辩若讷（nè）。", "最直的，看起来好像弯曲；最巧的，看起来好像笨拙；最能明辩的，看起来好像呆滞。"], ["躁（zào）胜寒，静胜热。清静为天下正。", "活动能战胜寒冷，静止能战胜炎热。本性清晰如镜，不干扰妄动什么，天下正因这本性而如此。"]]}, {"section": "德经", "title": "第四十六章", "pairs": [["天下有道，却走马以粪。", "天下合乎道的时候，战马都退下来用于农耕施肥。"], ["天下无道，戎（róng）马生于郊。", "天下不合道的时候，连怀胎的母马也被拉上战场，而导致在荒郊野外生下马驹。"], ["祸莫大于不知足；咎（jiù）莫大于欲得。", "最大的祸患，莫过于欲求无法控制的东西；最大的过错，莫过于总想得到什么。"], ["故知足之足，常足矣。", "所以，那种知道“够了”的满足（安于自足无缺的本源状态），才是恒常的满足。"]]}, {"section": "德经", "title": "第四十七章", "pairs": [["不出户，知天下；不窥牖（yǒu），见天道。", "不出门户，反而能知晓天下事；不望窗外，反而能看见自然系统运行的法则。"], ["其出弥远，其知弥少。", "（从表面的、符号概念的，去出发）奔走越远，反而真正认识道的越少。"], ["是以圣人不行而知，不见而名，不为而成。", "因此，得道者不必远行、亲自经历便能认识道；不必亲眼见道便能明了超越符号的概念的道；不必造作、勉强，万物的本来面目便能自成。"]]}, {"section": "德经", "title": "第四十八章", "pairs": [["为学日益，为道日损。", "从事于效仿普罗大众那般随波逐流的智巧，每天都要得到什么（却溢满而出）；归属于本来面目，每天反而减少造作、勉强。"], ["损之又损，以至于无为。", "减少再减少，直到不再造作、不再勉强的状态。"], ["无为而无不为。", "因为不造作、不勉强，反而没有什么事情做不到。"], ["取天下常以无事，及其有事，不足以取天下。", "取用天下，总要不（自以为是）刻意生事作为；等到（自以为是）刻意生事作为时，就不足以取用天下了。"]]}, {"section": "德经", "title": "第四十九章", "pairs": [["圣人无常心，以百姓心为心。", "得道者没有像常人般的内心，而把百姓那本性之心，当作自己洞察和行事的依凭。"], ["善者，吾善之；不善者，吾亦善之，德善。信者，吾信之；不信者，吾亦信之，德信。", "擅道的人，我以擅道对待他；不擅道的人，我也以擅道对待他，这样才自得其道。信任我的人，我以诚信对待他；不信任我的人，我也以诚信对待他，这样才自得诚信。"], ["圣人在天下，歙歙（xī）为天下浑其心。", "得道者处于天下，收敛造作，为了在接触天下时，使心混混沌沌不勉强。"], ["百姓皆注其耳目，圣人皆孩之。", "百姓都全神贯注于自己的感官体验，而得道者完全像婴儿那般与万物相处！"]]}, {"section": "德经", "title": "第五十章", "pairs": [["出生入死。", "从出生到死亡。"], ["生之徒，十有三；死之徒，十有三；人之生，动之死地，亦十有三。", "天生长寿的，占十分之三；天生短命的，占十分之三；本来可以长寿，却因自己的妄动而走向死亡的，也占十分之三。"], ["夫何故？以其生生之厚。", "这是什么缘故呢？因为过度地丰富、厚待自己这条生命。"], ["盖闻善摄生者，陆行不遇兕（sì）虎，入军不被（pī）甲兵。兕无所投其角，虎无所措其爪，兵无所容其刃。", "听说善于把握生命的人，在山中行走不会遇到犀牛和猛虎，在战场不会被兵器所伤。犀牛无处顶撞它的角，老虎无处施展它的爪，兵器无处刺入它的尖锐。"], ["夫何故？以其无死地。", "这是什么原因呢？因为他无心于那个致命的境地（安于无可奈何）。"]]}, {"section": "德经", "title": "第五十一章", "pairs": [["道生之，德畜（xù）之，物形之，势成之。", "万物仰赖存在本身而生；“无所得之得”育养万物，而“自得本性”；这作用使他们成型；环境时势促成了它们的成长。"], ["是以万物莫不尊道而贵德。", "所以万物没有不尊崇“本来面目”而且不珍视“自得本性”的。"], ["道之尊，德之贵，夫莫之命而常自然。", "道之所以被尊崇，德之所以被珍视，正是因为它们从不发号施令，也不是被谁强制、命令来的，因为不造作、勉强，而只是恒常顺应万物的本来面目。"], ["故道生之，德畜之；长之育之，成之孰之，养之覆之。", "因此，道生出万物，德育养万物；让它们生长，让它们发育；让它们成熟，让它们结果；滋养它们，庇护它们。"], ["生而不有，为而不恃，长而不宰，是谓玄德。", "道生养、容蓄万物，而不据为己有，有所作为而不执持，任其生长而不主宰，这就是幽深玄远的\"无所得之德\"。"]]}, {"section": "德经", "title": "第五十二章", "pairs": [["天下有始，以为天下母。", "天下万物有一个共同的开始，这个开始就是万物的母体——即存在本身（道）。"], ["既得其母，以知其子；既知其子，复守其母，没身不殆（dài）。", "既然得知了那母体，便能由此认识它的子女（万物）；既然认识了子女，再回头持守那母体，终身都不会有危殆。"], ["塞（sè）其兑，闭其门，终身不勤。", "堵塞住而入的孔窍，关闭掉而出的门户，终身都不会有劳扰烦乱。"], ["开其兑，济其事，终身不救。", "打开出入的孔窍，去成就那些外在的事务，终身都不可救药了。"], ["见小曰明，守柔曰强。", "能够看见并显现那微小的（本体的端倪），叫做明智；能够持守那柔弱的（不争的状态），叫做真正的强大。"], ["用其光，复归其明，无遗身殃（yāng），是谓袭常。", "用那向外分辨的光，再返回来内守自己才算明智，不给自己留下灾殃，这就叫做承袭那恒常不变的道。"]]}, {"section": "德经", "title": "第五十三章", "pairs": [["使我介然有知，行于大道，唯迤（yí）是畏。", "假如我稍微有所认知“道”，行走在大路上，唯一害怕的是走上歧路。"], ["大道甚夷，而民好径。", "大路十分平坦，可人们却偏爱走那些险峻的邪路。"], ["朝（cháo）甚除，田甚芜，仓甚虚。", "朝堂极其装饰华美（但是朝政废弛污败）；田地却极其荒芜；粮仓也极其空虚。"], ["服文采，带利剑，厌饮食，财货有余，是谓盗竽，非道也哉！", "穿着华丽的衣饰，佩带着锋利的宝剑，吃腻了山珍海味，占有的财物用不完，这是强盗头子，这哪里合乎道啊！"]]}, {"section": "德经", "title": "第五十四章", "pairs": [["善建者不拔，善抱者不脱，子孙以祭祀不辍。", "善于树立道的，不会拔取造作；善于抱持道的，不会剥离道：道生出的后代借着（那“无所得之德”）绵延不绝、生活祭祀不断。"], ["修之于身，其德乃真；修之于家，其德乃余；修之于乡，其德乃长；修之于邦，其德乃丰；修之于天下，其德乃普。", "将此道修之于自身，便自得真挚；将此道修之于家庭，便自足充裕；将此道修之于邻里，便自发生长；将此道修之于国家，便会丰厚自洽；将此道修之于天下，天下便各得其所，自然太平。"], ["故以身观身，以家观家，以乡观乡，以邦观邦，以天下观天下。", "所以，以自身来观照自身，以家庭来观照家庭，以邻里来观照邻里，以邦国来观照邦国，以天下来观照天下。"], ["吾何以知天下然哉？以此。", "我凭什么知道天下是这样的呢？就是凭这个——以自身本来面目来观自身。"]]}, {"section": "德经", "title": "第五十五章", "pairs": [["含德之厚，比于赤子。", "“无所得之德”的充沛者，好比初生的婴儿。"], ["蜂虿（chài）虺（huǐ）蛇不螫（shì），猛兽不据，攫（jué）鸟不搏。", "毒蜂、毒蝎、毒蛇不刺咬他，猛兽不扑抓他，凶鸟不搏击他。"], ["骨弱筋柔而握固，未知牝牡（mǔ）之合而朘（zuī）作，精之至也。", "筋骨柔弱，小手却握得牢固；不知道男女交合之事，小生殖器却自然勃起，这是精细柔弱、单纯到极点的体现啊！"], ["终日号而不嗄（shà），和之至也。知和曰常，知常曰明。", "整天啼哭，嗓子却不会沙哑，这是相容混和、无强争到极致的表现。知道相容混和、无强争，就叫做恒常之道；知道恒常之道，就叫做明智。"], ["益生曰祥，心使气曰强。物壮则老，谓之不道，不道早已。", "贪生怕死、刻意增益生命被认为是吉兆（其实会招来凶兆）；以主观意志造作、勉强而气喘吁吁，叫做逞强。万事万物过于壮大就会走向衰退，这就叫做不合于道，不合于道就会早早终结。"]]}, {"section": "德经", "title": "第五十六章", "pairs": [["知者不言，言者不知。", "真正知晓道的人，不执着于语言符号的概念去界定；执着语言符号的概念的人，其实并不真知晓道——因为道不可被语言符号的概念界定。"], ["塞其兑，闭其门，挫其锐，解其纷，和其光，同其尘，是谓玄同。", "堵住而入的孔窍，关闭而出的门户，磨损那锋芒，化解那纷争，调和自以为是的明耀，混同自以为贵于尘世，这就叫做幽深的同一。"], ["故不可得而亲，不可得而疏；不可得而利，不可得而害；不可得而贵，不可得而贱。", "所以，无法因自得本性而亲近什么，也无法因自得本性而疏远什么；无法因自得本性而取利什么，也无法因自得本性而加害什么；无法因自得本性而尊贵什么，也无法因自得本性而卑贱什么。"], ["故为天下贵。", "所以这（平常心）是天下那宝贵之所在啊！"]]}, {"section": "德经", "title": "第五十七章", "pairs": [["以正治国，以奇用兵，以无事取天下。", "以万物的本性来治理，以出其不意作战（为了不战而战），以不（自以为是）刻意生事作为来取用天下。"], ["吾何以知其然哉？以此。", "我凭什么知道是这样呢？就凭以下这些："], ["天下多忌讳，而民弥贫。民多利器，国家滋昏。", "在天下的限制越多，百姓反而越加贫乏。百姓手里的可以伤人的取胜手段越流行，国家反而越是混乱。"], ["人多伎巧，奇物滋起。法令滋彰，盗贼多有。", "人们的机巧之心越多，怪事、怪物反而层出不穷。法律命令越是繁明细密（供人效法追逐之物越是被彰显），大盗反而越兴起（连法网也窃去了）。"], ["故圣人云：我无为而民自化，我好静而民自正，我无事而民自富，我无欲而民自朴。", "所以得道者说：我不造作、不勉强，百姓便会自行化育；我喜好虚静，百姓便会自行回归本性；我不（自以为是）刻意生事，百姓便会自行富足；我没有妄欲，百姓便会简简单单，回归本来面目。"]]}, {"section": "德经", "title": "第五十八章", "pairs": [["其政闷闷，其民淳淳；其政察察，其民缺缺。", "治理宽厚混沌，百姓反而淳朴敦厚；治理严苛明察，百姓反而狡诈不安分。"], ["祸兮福之所倚，福兮祸之所伏。", "祸啊，福气依附于此；福啊，祸患暗藏于此。"], ["孰知其极？其无正。正复为奇，善复为妖。", "谁知道它们的最终结果呢？祸福并没有一个固定不变的标准。正常随时会变为反常，美善随时会变为丑恶。"], ["人之迷，其日固久。", "人们迷惑于此，已经由来很久了。"], ["是以圣人方而不割，廉而不刿（guì），直而不肆，光而不耀。", "因此，得道者：方正却不割伤人，锐利却不刺伤人，直率却不放肆，有所光荣却不耀眼。"]]}, {"section": "德经", "title": "第五十九章", "pairs": [["治人事天，莫若啬；夫唯啬，是谓早服。", "治理人事与自然系统，不如收敛（造作、勉强）。只有收敛（造作、勉强），这才叫做早早就服从了道。"], ["早服谓之重积德，重积德则无不克，无不克则莫知其极。", "早早回归本来面目，就叫做厚重地积累那“无所得之德”。厚重地积累无所得之德（变得无造作、勉强），就没有什么不能完成的。没有什么不能完成，便不知道无法完成的极限是什么。"], ["莫知其极，可以有国。有国之母，可以长久。", "不知道无法完成的极限是什么，当然可以保有国家。保有国家的根本母体，便可以长久。"], ["是谓深根固柢，长生久视之道。", "这就叫做：如同主根（道）扎得深、长得牢，是可以长久存续、恒久观照的方法。"]]}, {"section": "德经", "title": "第六十章", "pairs": [["治大国，若烹小鲜。", "治理大国，反而要像煎小鱼一样，不能频繁翻动、不能大火猛烧，否则小鱼就烂了。"], ["以道莅天下，其鬼不神。", "以道来临治天下，鬼点子就不扰乱心神了。"], ["非其鬼不神，其神不伤人。", "不仅鬼点子不扰乱心神，就算心神中有鬼点子出现也不会用于伤害人。"], ["非其神不伤人，圣人亦不伤人。", "不仅心神中的鬼点子不用于伤害人，得道者也因如此而不伤人。"], ["夫两不相伤，故德交归焉。", "若彼此间不互相伤害，所以那“无所得之德”便交汇归聚于彼此啊！"]]}, {"section": "德经", "title": "第六十一章", "pairs": [["大国者下流，天下之交，天下之牝。", "大国应当像居于下游的江河一样，是天下交汇的归属之地，是天下柔弱的雌性之位。"], ["牝常以静胜牡，以静为下。", "雌性常常凭借着虚静而赢得雄性的青睐，反而是因为虚静能安守低处的归属之地。"], ["故大国以下小国，则取小国；小国以下大国，则取大国。故或下以取，或下而取。", "所以大国以谦下的态度对待小国，就能取得小国的归附；小国以谦下的态度对待大国，就能取得大国的容纳。所以，或以谦下取得归附，或以谦下取得容纳。"], ["大国不过欲兼畜人，小国不过欲入事人。", "大国不过是想兼容并蓄这些小国，小国不过是想归附大国、在其中谋得生存。"], ["夫两者各得其所欲，大者宜为下。", "两者各自得到了自己想要的，但更关键的是：那相对而大的，反而适合主动处下。"]]}, {"section": "德经", "title": "第六十二章", "pairs": [["道者，万物之奥。善人之宝，不善人之所保。", "道，是万物的深藏庇护之归所。善于行道的人视它为珍宝，不善于行道的人也要靠它得以保全。"], ["美言可以市，尊行可以加人。人之不善，何弃之有？", "巧饰的言语符号能换利益，端正的外在行为能影响他人；（区区言辞举止尚且有用）人纵使不善于道，道又怎会舍弃他？"], ["故立天子，置三公，虽有拱璧以先驷（sì）马，不如坐进此道。", "所以，拥立首脑、置用重要领导层，即使拥有手捧无价之宝、最高规格车队在前的阵仗，也不如安坐下来进纳入这道。"], ["古之所以贵此道者何？不曰以求得，有罪以免邪？故为天下贵。", "从古至今，为什么珍视这个道呢？不就是（因为自由选择与自作自受）：有求就能得到，有罪可以免除吗？所以天下万物如此珍视它。"]]}, {"section": "德经", "title": "第六十三章", "pairs": [["为无为，事无事，味无味。", "为了无为去作为，为了无事情去行事，为了无味去品味。"], ["大小多少，报怨以德。", "大的化小、去多为少，用“能得到什么”的态度，来回应怨恨。"], ["图难于其易，为大于其细。天下难事，必作于易；天下大事，必作于细。", "要考虑困难的是由简单的组成，要考虑把大的解构为细小的。天下所有的难事，必然从容易处开始生起；天下所有的大事，必然从细微处开始生起。"], ["是以圣人终不为大，故能成其大。", "因此得道者始终不自以为了不起（并且不想着去成就什么大事），反而能成就真正的伟大。"], ["夫轻诺必寡信，多易必多难。是以圣人犹难之，故终无难矣。", "轻易许诺的人，必然很少能守信；把事情看得太容易的，必然会遭遇更多困难。因此得道者总是把事情看得很难（不使自己为物所累），所以最终反而没有为难之处。"]]}, {"section": "德经", "title": "第六十四章", "pairs": [["其安易持，其未兆易谋。其脆易泮（pàn），其微易散。为之于未有，治之于未乱。", "局面安定时，容易把持；事情还未显露应相时，容易谋划。脆弱时，容易消解；微小时，容易散失。为了未有而为，治理于无乱而治。"], ["合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。", "粗壮的大树，从细小萌芽长起；九层的高台，由一筐筐土堆积起来；千里的行程，开始于脚下第一步（大祸从小祸开始）。"], ["为者败之，执者失之。是以圣人无为，故无败；无执，故无失。", "造作、勉强的人会失败，执持的人会失去。因此得道者不造作、不勉强，所以没有失败；不执持，所以没有失去。"], ["民之从事，常于几成而败之。慎终如始，则无败事。", "人们做事，常常在快要成功的时候反而失败了。如果结尾时能像开头时那样谨慎对待，就不会有失败的事。"], ["是以圣人欲不欲，不贵难得之货；学不学，复众人之所过；以辅万物之自然，而不敢为。", "因此得道者把“不欲求无法控制的”当作欲求，不珍视、推崇那些稀有难得的东西；效仿别人不效仿的，复盘大家做得过分的地方。以此来辅助万物的本来面目，而不敢造作、勉强。"]]}, {"section": "德经", "title": "第六十五章", "pairs": [["古之善为道者，非以明民，将以愚之。", "古时善于行道的人，不是要用自以为的先见之明来治理百姓，而是要让自己少点自以为是的机巧伪智。"], ["民之难治，以其智多。", "百姓之所以难以治理，是因为统治者的机巧算计的伪智太多。"], ["故以智治国，国之贼；不以智治国，国之福。", "所以，用机巧伪智来治理国家，是国家的祸害；不用机巧智识来治理国家，是国家的福气。"], ["知此两者亦稽式，常知稽式，是谓玄德。", "懂得这两者的差别，就知晓了这个可以取舍的法则。经常（想起）认识这个取舍法则，就叫做幽深的“无所得之德”。"], ["玄德深矣远矣，与物反矣，然后乃至大顺。", "这“无所得之德”深啊，远啊，混同万物使之回归本性，这样终究会归顺那存在本身。"]]}, {"section": "德经", "title": "第六十六章", "pairs": [["江海所以能为百谷王者，以其善下之，故能为百谷王。", "江海之所以能成为众多河流汇聚之处，是因为它善于处在低下的位置，所以才能成为众多河流汇聚之处。"], ["是以欲上民，必以言下之；欲先民，必以身后之。", "因此，要居于百姓之上，必须先用谦下的表达对待百姓；想要引领百姓，必须把自己置身后位。"], ["是以圣人处上而民不重，处前而民不害。是以天下乐推而不厌。", "因此，得道者居于上位而百姓不感到沉重负担，处在前面引领而百姓不感到受到妨碍（也不会在背后害他）。因此天下人都乐于推举他而不厌弃他（天下万物会自然流向归顺于处于低位的得道者）。"], ["以其不争，故天下莫能与之争。", "正因为不与任何人相争，所以天下没有人能与他相争。"]]}, {"section": "德经", "title": "第六十七章", "pairs": [["天下皆谓我道大，似不肖（xiào）。夫唯大，故似不肖。若肖，久矣其细也夫！", "天下人都认为我说的道很大，好像不像任何具体的东西。正因为道大，所以才不像任何具体的东西。如果它像什么具体的东西，那它早就变得微不足道了！"], ["我有三宝，持而保之。一曰慈，二曰俭，三曰不敢为天下先。", "我有三件宝贝，持守而保全着我。第一件叫做“慈柔”，第二件叫做“收敛”，第三件叫做“不敢居于天下人前面”。"], ["慈故能勇；俭故能广；不敢为天下先，故能成器长。", "慈柔，反而能真正勇敢；收敛，反而能扩展出真正的广博；不敢居于天下人前面，反而能成为万物的首长。"], ["今舍慈且勇，舍俭且广，舍后且先，死矣！", "如今舍弃慈柔而只要勇敢，舍弃收敛而只要广博，舍弃退后而只要争先，那就死路一条了！"], ["夫慈，以战则胜，以守则固。天将救之，以慈卫之。", "慈柔，用来作战就能取胜，用来守卫就能坚固。自然系统要救助、成就谁，就用慈柔来守护它。"]]}, {"section": "德经", "title": "第六十八章", "pairs": [["善为士者不武；善战者不怒；善胜敌者不与；善用人者为之下。", "善于统帅的人不逞强；善于作战的人不轻易被激怒；善于战胜敌人的人不参与争斗、不正面交锋；善于用人的人，谦下给人空间发挥才能。"], ["是谓不争之德，是谓用人之力，是谓配天，古之极。", "这就叫做，不争自得；这就叫做，借用他人的力量（因为一切事物都依赖多种因素的共同作用）；这就叫做，符合自然系统的大道——这是自古以来最高的准则。"]]}, {"section": "德经", "title": "第六十九章", "pairs": [["用兵有言：吾不敢为主，而为客；不敢进寸，而退尺。", "用兵的人有这样一句话：我不敢主动挑起战事，而宁愿被动应战；不敢轻易前进一寸，而宁愿退后一尺。"], ["是谓行无行，攘（rǎng）无臂，扔无敌，执无兵。", "这就叫做：能列阵却不摆战阵，能挥拳却不动手，能抗敌却无心树敌，持有兵器却不轻易动武。"], ["祸莫大于轻敌，轻敌几丧吾宝。", "祸患没有比自以为无敌而轻敌更大的了，轻敌几乎会丧失掉我的“三宝”（慈、俭、不敢为天下先）。"], ["故抗兵相若，哀者胜矣。", "所以两军对峙、实力相当时，那个因不得已而悲愤（或怀有悲悯之心）的一方能够获胜。"]]}, {"section": "德经", "title": "第七十章", "pairs": [["吾言甚易知，甚易行。天下莫能知，莫能行。", "我的话很容易明白，很容易实行。可天下人却没有谁能明白，没有谁能实行。"], ["言有宗，事有君。夫唯无知，是以不我知。", "我的言论有它的主旨（道），做事有它的根本（道）。正是因为人们不知道这个道理，所以才不了解我。"], ["知我者希，则我者贵。是以圣人被褐怀玉。", "能了解我的人很少，能效法我的人就更难得了。因此，得道者外表穿着粗布衣服，怀里却揣着美玉。"]]}, {"section": "德经", "title": "第七十一章", "pairs": [["知不知，上；不知知，病。", "知道自己还有所无知，这是高明的；不知道却自以为是，这就是毛病了。"], ["夫唯病病，是以不病。", "正因为他把这个毛病当作毛病来对待，所以他才不会犯这种毛病。"], ["圣人不病，以其病病，是以不病。", "得道者没有这个毛病，正因为他把这个毛病当作毛病来对待，所以他才没有这个毛病。"]]}, {"section": "德经", "title": "第七十二章", "pairs": [["民不畏威，则大威至。", "当百姓不畏惧权威（压迫、恐吓的手段失效），那么更大的祸乱就会到来。"], ["无狎（xiá）其所居，无厌（yā）其所生。", "不要逼迫百姓，使其不得安于居所；不要阻塞百姓，使其无法谋生。"], ["夫唯不厌，是以不厌。", "正因为不压迫百姓，所以百姓才不会厌弃统治者。"], ["是以圣人自知不自见，自爱不自贵。", "因此，得道者有自知之明，却不自我显现；懂得自爱，却不自居高贵。"], ["故去彼取此。", "所以，要舍弃那自我显现、自居高贵，选取这自知、自爱。"]]}, {"section": "德经", "title": "第七十三章", "pairs": [["勇于敢则杀，勇于不敢则活。", "勇于逞强、轻举妄动的，就会走向死路；勇于不逞强、不敢妄动的，就会走向活路。"], ["此两者，或利或害。", "这两种“勇”，一个有利，一个有害。"], ["天之所恶，孰知其故？", "自然系统所厌恶“敢”，谁知道其中的缘故呢？"], ["是以圣人犹难之。", "因此，得道者总是把事情看得很难。"], ["天之道，不争而善胜，不言而善应，不召而自来，繟（chǎn）然而善谋。", "自然系统的法则是：不争斗却善于取胜，不说话却善于回应，不召唤却自己到来，宽缓从容却善于谋划。"], ["天网恢恢，疏而不失。", "自然系统的网广大无边，网眼稀疏却不会有任何遗漏。"]]}, {"section": "德经", "title": "第七十四章", "pairs": [["民不畏死，奈何以死惧之？", "百姓如果不怕死，如何通过死亡来使他们心存畏惧呢？"], ["若使民常畏死，而为奇者，吾得执而杀之，孰敢？", "如果想要让百姓总是怕死，那么对于那些不被人为寻常约束的人，我抓来杀掉，谁还敢乱来呢？"], ["常有司杀者杀，夫代司杀者杀，是谓代大匠斫（zhuó）。", "但自然系统自有其生杀规律，代替自然系统去杀戮，这就好比代替高明的木匠去砍木头。"], ["夫代大匠斫者，希有不伤其手矣。", "代替高明的木匠去砍木头的人，很少有不伤到自己手的。"]]}, {"section": "德经", "title": "第七十五章", "pairs": [["民之饥，以其上食税之多，是以饥。", "百姓之所以感到不足，是因为统治者想分取的资源太多，所以才感到不足。"], ["民之难治，以其上之有为，是以难治。", "百姓之所以难以治理，是因为统治者强行造作、勉强作为，所以才难以治理。"], ["民之轻死，以其求生之厚，是以轻死。", "百姓之所以轻生赴死（去谋反），是因为统治者过度地丰富、厚待自己这条生命（而食税、有为），才导致百姓活不下去。"], ["夫唯无以生为者，是贤于贵生。", "只有不追求：过度地丰富、厚待自己这条生命的人，才算比那些过度看重自己生命的人高明。"]]}, {"section": "德经", "title": "第七十六章", "pairs": [["人之生也柔弱，其死也坚强。万物草木之生也柔脆，其死也枯槁。", "人活着的时候，身体是柔软的；死了以后，就变得坚挺、僵化。草木活着的时候，枝条是脆嫩的；死了以后，就变得干枯、发硬。"], ["故坚强者死之徒，柔弱者生之徒。", "所以，坚强硬挺的东西，就属于死亡的那类；柔弱微细的东西，就属于存活的那类。"], ["是以兵强则灭，木强则折。", "因此，用兵逞强反而不能取胜，树木长到过于刚硬就会被折断。"], ["强大处下，柔弱处上。", "强大硬挺的东西反而处于劣势，柔弱微细的东西反而处于优势。"]]}, {"section": "德经", "title": "第七十七章", "pairs": [["天之道，其犹张弓与？高者抑之，下者举之；有余者损之，不足者补之。", "自然系统的运行法则，不就像拉弓射箭？高了就压低些，低了就抬高些；有余的就减损些，不足的就补足些。"], ["天之道，损有余而补不足。人之道则不然，损不足以奉有余。", "自然系统的法则，是减损那有余，而补足那不足的。人为的法则却不一样，是剥夺那本已不足的，去供奉那本已有余的。"], ["孰能有余以奉天下？唯有道者。", "谁能够把有余的东西拿出来奉养天下不足呢？只有（无为的）得道者！"], ["是以圣人为而不恃，功成而不处，其不欲见贤。", "因此，得道者有所作为却不执持，大功告成却不居守其功，也不愿意显现自己有多贤明、有多能耐。"]]}, {"section": "德经", "title": "第七十八章", "pairs": [["天下莫柔弱于水，而攻坚强者莫之能胜，以其无以易之。", "天下没有比水更柔软脆弱的东西了，可是在攻克坚硬强大这方面，却没有谁能比得过水，似乎没有什么能代替得了水的这种作用。"], ["弱之胜强，柔之胜刚，天下莫不知，莫能行。", "弱小反而能战胜强大，柔软反而能战胜刚硬，可是天下没有人不愿舍去自以为知，没有谁能做得到不造作、不勉强。"], ["是以圣人云：受国之垢，是谓社稷主；受国不祥，是为天下王。", "因此得道者说：能承受国家的屈辱与污垢，这才配拥有政权；能承受国家的不祥与灾祸，这才配做天下的统治者——天下有屈辱、困难时，顺应民心而出。"], ["正言若反。", "这些实话，听起来却像是反话（出自本性的言论，如同使人返回本源）。"]]}, {"section": "德经", "title": "第七十九章", "pairs": [["和（huò）大怨，必有余怨，安可以为善？", "掺和深重的怨恨，一定还会有残留的怨恨，这怎么能算得上是妥善的办法呢？"], ["是以圣人执左契，而不责于人。", "因此，得道者拿借据契约，却不去向债务人追讨（不让“欠我”反成“我欠”）。"], ["有德司契，无德司彻。", "能有所得的人，（对待亏欠）就像持有借据契约，静观其变；而没能有所得的人，（对待亏欠）就像掌管税收的人一样刻薄。"], ["天道无亲，常与善人。", "自然系统没有偏私偏爱，却总是帮助那善于顺应道的人。"]]}, {"section": "德经", "title": "第八十章", "pairs": [["小国寡民。", "小政府，少管民。"], ["使有什伯之器而不用，使民重死而不远徙（xǐ）。", "即使有各种各样的器具，也不去滥用；使百姓重视死亡，而不冒着生命危险向远方迁徙。"], ["虽有舟舆（yú），无所乘之；虽有甲兵，无所陈之。", "虽然有船有车，却（因为没有目的地）无需乘坐；虽然有铠甲兵器，却（因为没有敌方）无需陈列。"], ["使民复结绳而用之。", "使百姓（少执迷于语言符号的概念，少算计）如结绳记事那般。"], ["甘其食，美其服，安其居，乐其俗。", "人们觉得自己的食物美味，觉得自己的衣服美好，安于自己的居所，乐于自己的世俗生活、风俗习惯。"], ["邻国相望，鸡犬之声相闻，民至老死不相往来。", "邻国之间互相望得见，鸡鸣狗叫的声音互相听得见，可是百姓直到老死，也不互相往来。"]]}, {"section": "德经", "title": "第八十一章", "pairs": [["信言不美，美言不信。", "真实可信的言论不华丽，华丽的言论不真实可信。"], ["善者不辩，辩者不善。", "善于做事的人不在无关紧要上分辩，在无关紧要上分辩的人不善于做事。"], ["知者不博，博者不知。", "认识道的人不博取，博取的人并不认识道。"], ["圣人不积，既以为人，己愈有；既以与人，己愈多。", "得道者不积累占有什么，越是用来帮助别人，自己反而越充足；越是给予别人，自己反而越丰富——因为一切事物都依赖多种因素的共同作用，且物极必反。"], ["天之道，利而不害；圣人之道，为而不争。", "自然系统的法则，是惠及万物的本性，而不加以损害；得道者的法则，是有所无为与无争。"]]}];

// ===== 渲染导航 =====
function renderNav(){
  const nav = document.getElementById('navList');
  let html = '';
  let currentSection = '';
  CHAPTERS.forEach((ch,i)=>{
    if(ch.section !== currentSection){
      currentSection = ch.section;
      html += `<div class="nav-section"><div class="nav-section-title">${ch.section}</div><ul class="nav-list">`;
    }
    html += `<li data-idx="${i}">${ch.title}</li>`;
    // close section when next section changes
    const next = CHAPTERS[i+1];
    if(!next || next.section !== currentSection){
      html += '</ul></div>';
    }
  });
  nav.innerHTML = html;
  nav.querySelectorAll('li').forEach(li=>{
    li.addEventListener('click',()=>{
      const idx = parseInt(li.dataset.idx);
      scrollToChapter(idx);
      if(window.innerWidth<=900) document.getElementById('sidebar').classList.remove('open');
    });
  });
}

// ===== 渲染章节 =====
function renderChapters(){
  const container = document.getElementById('chaptersContainer');
  let html = '';
  CHAPTERS.forEach((ch,i)=>{
    html += `<div class="chapter-block" id="ch-${i}">
      <div class="chapter-header">
        <span class="chapter-num">${ch.title}</span>
        <span class="chapter-section">${ch.section}</span>
      </div>`;
    ch.pairs.forEach(p=>{
      html += `<div class="pair">
        <div class="original">${p[0]}</div>
        ${p[1]?`<div class="annotation">${p[1]}</div>`:''}
      </div>`;
    });
    html += `</div>`;
  });
  container.innerHTML = html;
}

// ===== 滚动定位 =====
function scrollToChapter(idx){
  const el = document.getElementById('ch-'+idx);
  if(el){
    el.scrollIntoView({behavior:'smooth',block:'start'});
    document.querySelectorAll('.nav-list li').forEach(li=>li.classList.remove('active'));
    const activeLi = document.querySelector(`.nav-list li[data-idx="${idx}"]`);
    if(activeLi) activeLi.classList.add('active');
  }
}

// ===== 滚动显现 =====
function observeChapters(){
  const blocks = document.querySelectorAll('.chapter-block');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('visible');
        // update nav active
        const id = e.target.id;
        const idx = id.replace('ch-','');
        document.querySelectorAll('.nav-list li').forEach(li=>li.classList.remove('active'));
        const li = document.querySelector(`.nav-list li[data-idx="${idx}"]`);
        if(li) li.classList.add('active');
      }
    });
  },{threshold:.1});
  blocks.forEach(b=>obs.observe(b));
}

// ===== 鼠标柔光 =====
function initCursorGlow(){
  const glow = document.getElementById('cursorGlow');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{
    mx=e.clientX;my=e.clientY;
    glow.style.opacity='1';
  });
  document.addEventListener('mouseleave',()=>glow.style.opacity='0');
  function animate(){
    rx+=(mx-rx)*.08;ry+=(my-ry)*.08;
    glow.style.left=rx+'px';glow.style.top=ry+'px';
    requestAnimationFrame(animate);
  }
  animate();
}

// ===== 颗粒 =====
function initParticles(){
  const aurora = document.querySelector('.aurora');
  for(let i=0;i<30;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*15)+'s';
    p.style.animationDelay=Math.random()*12+'s';
    p.style.width=p.style.height=(2+Math.random()*4)+'px';
    aurora.appendChild(p);
  }
}

// ===== 返回顶部 =====
function initBackTop(){
  const btn = document.getElementById('backTop');
  window.addEventListener('scroll',()=>{
    if(window.scrollY>400) btn.classList.add('show');
    else btn.classList.remove('show');
  });
  btn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
}

// ===== 移动端菜单 =====
function initMenu(){
  document.getElementById('menuToggle').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
}

// ===== 启动 =====
renderNav();
renderChapters();
observeChapters();
initCursorGlow();
initParticles();
initBackTop();
initMenu();
</script>
</body>
</html>
